<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records</title>
  <link rel="stylesheet" href="styles/project-large.css">
  <link rel="stylesheet" href="styles/project-mobile.css">
</head>
<body>
    <header>
        <img src="images/ism-logo.webp" alt="Instituto Privado Salvador Moncada Logo">
        <h1>INSTITUTO PRIVADO SALVADOR MONCADA</h1>
        <button type="button" id="menu" title="Menu"></button>
        <nav id="nav-container">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="discover.html">DISCOVER</a></li>
                <li><a href="register.html">REGISTER</a></li>
                <li><a href="records.html" class="active">RECORDS</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Student Records</h2>
        
        <!-- Vertical & Expandable CRUD Container Menu Component -->
        <div class="vertical-menu-container">
            <button class="menu-toggle-btn" id="menu-toggle">
                <span>⚙️ Manage Records Options</span>
                <span id="toggle-icon">▼</span>
            </button>
            <div class="vertical-menu-list" id="vertical-menu-list">
                <button class="crud-vertical-btn" data-action="get">🔍 Get Record by ID</button>
                <button class="crud-vertical-btn" data-action="create">➕ Create New Record</button>
                <button class="crud-vertical-btn" data-action="update">✏️ Update Record by ID</button>
                <button class="crud-vertical-btn" data-action="delete">❌ Delete Record by ID</button>
            </div>
        </div>

        <!-- The target grade table section displays below once an action item is chosen -->
        <section id="records-container">
            <!-- Dynamic data output or fields load contextually -->
        </section>
    </main>
    <script src="scripts/records.js"></script>
</body>
</html>
